<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verish Shopify 데이터 어시스턴트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f5f5f7;
    display: flex;
    justify-content: center;
    height: 100vh;
  }
  #app { width: 100%; max-width: 720px; display: flex; flex-direction: column; height: 100vh; }

  #login-screen {
    margin: auto;
    background: white;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    width: 320px;
    text-align: center;
  }
  #login-screen h1 { font-size: 18px; margin-bottom: 16px; }
  #login-screen input {
    width: 100%; padding: 10px; font-size: 14px;
    border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px;
  }
  #login-screen button, .send-btn {
    width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
    background: #d4633a; color: white; border: none; border-radius: 8px; cursor: pointer;
  }
  #login-error { color: #c0392b; font-size: 13px; margin-top: 8px; min-height: 16px; }

  header {
    padding: 16px 20px; background: white; border-bottom: 1px solid #e5e5e5;
    font-weight: 700; font-size: 15px;
  }
  #messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #d4633a; color: white; }
  .msg.assistant { align-self: flex-start; background: white; border: 1px solid #e5e5e5; }
  .msg.pending { align-self: flex-start; background: #fff8e1; border: 1px solid #f0d060; font-size: 13px; color: #7a5c00; }

  #input-bar { display: flex; gap: 8px; padding: 16px 20px; background: white; border-top: 1px solid #e5e5e5; }
  #input-bar input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  #input-bar button { width: 72px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="app">
    <div id="login-screen">
      <h1>Verish Shopify 데이터 어시스턴트</h1>
      <input id="passcode" type="password" placeholder="공유받은 비밀번호" />
      <button id="login-btn">입장하기</button>
      <div id="login-error"></div>
    </div>

    <div id="chat-screen" class="hidden" style="display:flex; flex-direction:column; height:100vh;">
      <header>Verish Shopify 데이터 어시스턴트 (해외 자사몰)</header>
      <div id="messages"></div>
      <div id="input-bar">
        <input id="msg-input" type="text" placeholder="예: 이번 달 브라탑 카테고리 매출 top5 알려줘" />
        <button class="send-btn" id="send-btn">전송</button>
      </div>
    </div>
  </div>

<script>
  let passcode = "";
  let sessionId = null;

  const loginScreen = document.getElementById("login-screen");
  const chatScreen = document.getElementById("chat-screen");
  const messagesEl = document.getElementById("messages");
  const msgInput = document.getElementById("msg-input");

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  document.getElementById("login-btn").addEventListener("click", async () => {
    const value = document.getElementById("passcode").value;
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passcode: value }),
    });
    if (!res.ok) {
      document.getElementById("login-error").textContent = "비밀번호가 틀렸습니다.";
      return;
    }
    passcode = value;
    const sessionRes = await fetch("/api/session-id");
    sessionId = (await sessionRes.json()).sessionId;
    loginScreen.classList.add("hidden");
    chatScreen.classList.remove("hidden");
    addMessage("무엇을 도와드릴까요? (상품/주문/재고/매출 조회, 수정 요청 모두 가능합니다)", "assistant");
    msgInput.focus();
  });
  document.getElementById("passcode").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("login-btn").click();
  });

  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = "";
    addMessage(text, "user");
    const thinking = addMessage("생각 중...", "assistant");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-passcode": passcode },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await res.json();
      thinking.remove();
      addMessage(data.reply ?? data.error ?? "(응답 없음)", "assistant");
    } catch (err) {
      thinking.remove();
      addMessage("오류가 발생했습니다: " + err.message, "assistant");
    }
  }

  document.getElementById("send-btn").addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
