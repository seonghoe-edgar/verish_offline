<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F4EE; --surface:#FFFFFF; --surface-2:#EFEAE0; --ink:#24211D; --ink-dim:#6E675C;
    --line:#E3DBCC; --line-strong:#D2C7B4;
    --accent:#B85A22; --accent-bg:#F6E4D2; --accent-ink:#5C2C0F;
    --accent-2:#22665F; --accent-2-bg:#DCEAE6; --accent-2-ink:#123832;
    --ok:#3F7D52; --ok-bg:#E4EFE4;
    --warn:#A8752E; --warn-bg:#F3E7CC;
    --critical:#B23B33; --critical-bg:#F6E1DE;
    --shadow: 0 1px 2px rgba(36,33,29,.06), 0 6px 20px rgba(36,33,29,.06);
    --radius: 12px;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --display: "Noto Serif KR", "Noto Sans KR", serif;
    --mono: "Roboto Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1815; --surface:#242019; --surface-2:#2C271F; --ink:#F1EBE2; --ink-dim:#A79C8C;
      --line:#3B342A; --line-strong:#4A4133;
      --accent:#E8935A; --accent-bg:#3A2718; --accent-ink:#F6D9BE;
      --accent-2:#6FBBAF; --accent-2-bg:#1B322E; --accent-2-ink:#BFE7DE;
      --ok:#7FBF93; --ok-bg:#1E3024; --warn:#E0B36B; --warn-bg:#3A2E17;
      --critical:#E58F8A; --critical-bg:#3A211F;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1815; --surface:#242019; --surface-2:#2C271F; --ink:#F1EBE2; --ink-dim:#A79C8C;
    --line:#3B342A; --line-strong:#4A4133;
    --accent:#E8935A; --accent-bg:#3A2718; --accent-ink:#F6D9BE;
    --accent-2:#6FBBAF; --accent-2-bg:#1B322E; --accent-2-ink:#BFE7DE;
    --ok:#7FBF93; --ok-bg:#1E3024; --warn:#E0B36B; --warn-bg:#3A2E17;
    --critical:#E58F8A; --critical-bg:#3A211F;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#F7F4EE; --surface:#FFFFFF; --surface-2:#EFEAE0; --ink:#24211D; --ink-dim:#6E675C;
    --line:#E3DBCC; --line-strong:#D2C7B4;
    --accent:#B85A22; --accent-bg:#F6E4D2; --accent-ink:#5C2C0F;
    --accent-2:#22665F; --accent-2-bg:#DCEAE6; --accent-2-ink:#123832;
    --ok:#3F7D52; --ok-bg:#E4EFE4; --warn:#A8752E; --warn-bg:#F3E7CC;
    --critical:#B23B33; --critical-bg:#F6E1DE;
    --shadow: 0 1px 2px rgba(36,33,29,.06), 0 6px 20px rgba(36,33,29,.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:#fff; }
  .wrap{ max-width:1180px; margin:0 auto; padding:32px 20px 64px; }

  header.top{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
  header.top h1{
    font-family:var(--display); font-weight:700; font-size:26px; letter-spacing:-0.01em;
    margin:0; text-wrap:balance;
  }
  header.top .sub{ color:var(--ink-dim); font-size:13px; margin-top:4px; max-width:640px; }
  header.top .meta{ text-align:right; font-size:12px; color:var(--ink-dim); font-family:var(--mono); }
  header.top .meta b{ color:var(--ink); font-weight:600; }

  .legend{ font-size:12px; color:var(--ink-dim); margin-bottom:20px; }

  .kpis{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); flex:1 1 180px;
  }
  .kpi .label{ font-size:12px; color:var(--ink-dim); font-weight:500; }
  .kpi .value{ font-family:var(--display); font-weight:700; font-size:28px; margin-top:6px; font-variant-numeric:tabular-nums; }
  .kpi.rt .value{ color:var(--critical); }
  .kpi .value small{ font-family:var(--sans); font-size:13px; font-weight:500; color:var(--ink-dim); }
  .kpi.stores{ flex:2 1 320px; }
  .store-flow-grid{ display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:8px; }
  .store-flow-grid .row{ font-size:13px; }
  .store-flow-grid .name{ font-weight:600; }
  .store-flow-grid .nums{ font-family:var(--mono); font-size:12.5px; color:var(--ink-dim); }
  .store-flow-grid .nums b.in{ color:var(--ok); }
  .store-flow-grid .nums b.out{ color:var(--accent); }

  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; box-shadow:var(--shadow);
  }
  .controls input[type="search"]{
    flex:1 1 220px; min-width:160px; padding:8px 12px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:13px;
  }
  .controls input[type="search"]:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .controls select{
    padding:8px 10px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:13px;
  }
  .seg{ display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; }
  .seg button{
    border:none; background:var(--surface); color:var(--ink-dim); font-family:var(--sans); font-size:12.5px;
    font-weight:600; padding:8px 12px; cursor:pointer; border-right:1px solid var(--line-strong);
  }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--ink); color:var(--surface); }
  .seg button:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .count{ font-size:12px; color:var(--ink-dim); font-family:var(--mono); margin-left:auto; }

  .table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:780px; }
  thead th{
    text-align:left; font-size:11px; letter-spacing:.03em; text-transform:uppercase; font-weight:600;
    color:var(--ink-dim); padding:10px 12px; border-bottom:1px solid var(--line-strong); white-space:nowrap;
    background:var(--surface-2); position:sticky; top:0;
  }
  tbody td{ padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  .prod{ font-weight:600; }
  .opt{ color:var(--ink-dim); font-size:12px; margin-top:1px; }
  .cat{ display:inline-block; font-size:11px; color:var(--ink-dim); background:var(--surface-2); border:1px solid var(--line); padding:1px 7px; border-radius:999px; }
  .mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .dim{ color:var(--ink-dim); }

  .store-status{ display:flex; flex-wrap:wrap; gap:6px; }
  .store-pill{
    display:inline-flex; align-items:baseline; gap:5px; font-size:11.5px; padding:3px 8px;
    border-radius:999px; border:1px solid var(--line-strong); white-space:nowrap;
  }
  .store-pill .n{ font-weight:600; }
  .store-pill .d{ font-family:var(--mono); font-weight:600; }
  .store-pill.ok{ background:var(--ok-bg); color:var(--ok); border-color:transparent; }
  .store-pill.warn{ background:var(--warn-bg); color:var(--warn); border-color:transparent; }
  .store-pill.critical{ background:var(--critical-bg); color:var(--critical); border-color:transparent; }
  .store-pill.na{ background:var(--surface-2); color:var(--ink-dim); }

  .flows{ display:flex; flex-direction:column; gap:5px; }
  .flow-chip{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .flow-chip .badge{ padding:2px 8px; border-radius:6px; font-size:11.5px; font-weight:700; background:var(--surface-2); color:var(--ink); }
  .flow-chip .arrow{ color:var(--ink-dim); }
  .flow-chip .qty{ font-family:var(--mono); color:var(--accent); }
  .flow-chip .note{ display:block; font-family:var(--sans); font-weight:400; font-size:11px; color:var(--warn); }

  .empty{ padding:40px 16px; text-align:center; color:var(--ink-dim); }
  footer{ margin-top:22px; font-size:11.5px; color:var(--ink-dim); }
  footer a{ color:inherit; }

  @media (max-width:720px){
    .kpis{ flex-direction:column; }
  }
</style>

  <footer id="footerNote"></footer>
</div>

    const s = SNAPSHOT.summary;
    const storeRows = s.byStore.map(st =>
      '<div class="row"><span class="name">' + st.name + '</span> <span class="nums"><b class="in">←' + st.in + '</b> / <b class="out">' + st.out + '→</b></span></div>'
    ).join('');
    document.getElementById('kpis').innerHTML =
      '<div class="kpi rt"><div class="label">RT 대상 SKU</div><div class="value">' + s.rtTotal + '<small> / ' + s.totalSkus + '</small></div></div>' +
      '<div class="kpi stores"><div class="label">매장별 수신(←) / 발신(→) 건수</div><div class="store-flow-grid">' + storeRows + '</div></div>';
  }

  let currentFilter = 'rt';
  let currentQuery = '';
  let currentStore = 'all';

  function applyFilters(){
    const q = currentQuery.trim().toLowerCase();
    return SNAPSHOT.items.filter((item) => {
      if (currentFilter === 'rt' && item.flows.length === 0) return false;
      if (currentStore !== 'all') {
        // 매장을 고르면 그 매장이 "받는"(to) RT 이동이 있는 SKU만 — 수신 매장 관점
        const receiving = item.flows.some(f => f.to === currentStore);
        if (!receiving) return false;
      }
      if (!q) return true;
      const hay = (item.productName + ' ' + item.productCode + ' ' + (item.colorName || '') + ' ' + (item.styleName || '')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function render(){
    const filtered = applyFilters();
    document.getElementById('rows').innerHTML = filtered.map(rowHtml).join('');
    document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';
    document.getElementById('count').textContent = filtered.length + '건 표시';
  }

  document.getElementById('search').addEventListener('input', (e) => { currentQuery = e.target.value; render(); });
  document.getElementById('storeFilter').addEventListener('change', (e) => { currentStore = e.target.value; render(); });
  document.querySelectorAll('#dirFilter button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#dirFilter button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.v;
      render();
    });
  });

  renderHeader();
  renderKpis();
  render();
</script>
