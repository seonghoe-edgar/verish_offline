<title>VERISH DP 조닝 대시보드</title>
<style>
  :root{
    --paper:#F6F3EF; --paper-2:#EEE8E0; --ink:#2A2420; --ink-dim:#6B6058;
    --line:#E2DAD0; --accent:#8C4A3C; --accent-ink:#FFFFFF; --accent-2:#435C54;
    --ok:#3F7D5C; --ok-bg:#E4EFE7; --warn:#B8863B; --warn-bg:#F6ECDA; --danger:#B23B3B; --danger-bg:#F6E1DF;
    --card:#FFFFFF; --shadow: 0 1px 2px rgba(42,36,32,.06), 0 4px 16px rgba(42,36,32,.05);
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
    --serif: Georgia, "Noto Serif KR", "Nanum Myeongjo", serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#1C1917; --paper-2:#252119; --ink:#EFEAE4; --ink-dim:#9A8F84;
      --line:#3A332C; --accent:#DE8F79; --accent-ink:#241410; --accent-2:#8FB5A6;
      --ok:#7FBF9B; --ok-bg:#1E2C24; --warn:#E0B36B; --warn-bg:#332A18; --danger:#E58F8B; --danger-bg:#332120;
      --card:#231F1A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1917; --paper-2:#252119; --ink:#EFEAE4; --ink-dim:#9A8F84;
    --line:#3A332C; --accent:#DE8F79; --accent-ink:#241410; --accent-2:#8FB5A6;
    --ok:#7FBF9B; --ok-bg:#1E2C24; --warn:#E0B36B; --warn-bg:#332A18; --danger:#E58F8B; --danger-bg:#332120;
    --card:#231F1A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --paper:#F6F3EF; --paper-2:#EEE8E0; --ink:#2A2420; --ink-dim:#6B6058;
    --line:#E2DAD0; --accent:#8C4A3C; --accent-ink:#FFFFFF; --accent-2:#435C54;
    --ok:#3F7D5C; --ok-bg:#E4EFE7; --warn:#B8863B; --warn-bg:#F6ECDA; --danger:#B23B3B; --danger-bg:#F6E1DF;
    --card:#FFFFFF; --shadow: 0 1px 2px rgba(42,36,32,.06), 0 4px 16px rgba(42,36,32,.05);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--accent); color: var(--accent-ink); }

  .app{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:230px; flex:0 0 230px; background:var(--paper-2); border-right:1px solid var(--line);
    padding:20px 14px; display:flex; flex-direction:column; gap:18px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ padding:2px 6px 10px; border-bottom:1px solid var(--line); }
  .brand .mark{ font-family:var(--serif); font-size:20px; letter-spacing:.02em; }
  .brand .sub{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:3px; }

  .storelist{ display:flex; flex-direction:column; gap:3px; }
  .store-group-label{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.09em; padding:10px 8px 4px; }
  .store-btn{
    all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 9px; border-radius:8px; font-size:13.2px; color:var(--ink);
  }
  .store-btn:hover{ background:rgba(140,74,60,.08); }
  .store-btn.active{ background:var(--accent); color:var(--accent-ink); }
  .store-btn .tier{ font-size:10px; padding:1px 6px; border-radius:99px; background:rgba(140,74,60,.12); color:var(--accent); flex:0 0 auto; }
  .store-btn.active .tier{ background:rgba(255,255,255,.22); color:var(--accent-ink); }

  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); font-size:11px; color:var(--ink-dim); }
  .snap-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--warn); margin-right:5px; box-shadow:0 0 0 2px var(--warn-bg); }

  /* ---------- main ---------- */
  main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; gap:16px; padding:16px 26px; border-bottom:1px solid var(--line);
    flex-wrap:wrap; position:sticky; top:0; background:var(--paper); z-index:5;
  }
  .topbar h1{ font-family:var(--serif); font-weight:400; font-size:19px; margin:0; text-wrap:balance; }
  .topbar .meta{ font-size:11.5px; color:var(--ink-dim); }
  .snap-badge{
    margin-left:auto; font-size:11.5px; color:var(--ink-dim); display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:99px; background:var(--warn-bg); color:var(--warn); white-space:nowrap;
  }
  .btn:focus-visible, .store-btn:focus-visible, input:focus-visible, .pill:focus-visible, select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .searchwrap{ padding:14px 26px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .searchbox{
    flex:1; min-width:240px; display:flex; align-items:center; gap:8px; background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:9px 12px;
  }
  .searchbox input{
    all:unset; flex:1; font-size:13.5px; color:var(--ink); font-family:var(--sans);
  }
  .searchbox input::placeholder{ color:var(--ink-dim); }
  .scope-toggle{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .scope-toggle button{
    all:unset; cursor:pointer; font-size:12px; padding:8px 12px; color:var(--ink-dim);
  }
  .scope-toggle button.active{ background:var(--accent); color:var(--accent-ink); }

  .content{ padding:16px 26px 40px; }

  .zone-pills{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px; align-items:center; }
  .pill{
    all:unset; cursor:pointer; font-size:12.5px; padding:7px 13px; border-radius:99px; border:1px solid var(--line);
    color:var(--ink-dim); background:var(--card); font-variant-numeric:tabular-nums;
  }
  .pill:hover{ color:var(--ink); }
  .pill.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  :root[data-theme="dark"] .pill.active, @media (prefers-color-scheme:dark){ .pill.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent);} }
  .loc-select{
    font-size:12.5px; padding:7px 10px; border-radius:99px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-dim); font-family:var(--sans); cursor:pointer; max-width:170px;
  }
  .loc-select:hover{ color:var(--ink); }
  #clearFixture{ background:var(--danger-bg); color:var(--danger); border-color:transparent; }

  .fixture-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:14px; }
  .fixture-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 15px;
    box-shadow:var(--shadow);
  }
  .fixture-card .fhead{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .fixture-card .fname{ font-size:14.5px; font-weight:600; }
  .fixture-card .fzone{ font-size:10px; font-weight:500; color:var(--ink-dim); background:var(--paper-2); padding:1px 7px; border-radius:99px; vertical-align:middle; }
  .fixture-card .fcount{ font-size:11.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .capbar{ height:5px; border-radius:99px; background:var(--paper-2); overflow:hidden; margin:8px 0 12px; }
  .capbar > div{ height:100%; border-radius:99px; background:var(--accent-2); }
  .capbar > div.over{ background:var(--danger); }
  .capbar > div.warn{ background:var(--warn); }

  .plist{ display:flex; flex-direction:column; gap:8px; }
  .prow{ display:flex; gap:9px; align-items:center; }
  .thumb{
    width:32px; height:32px; border-radius:7px; flex:0 0 auto; background:var(--paper-2);
    display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid var(--line);
    font-size:13px; color:var(--ink-dim); font-family:var(--serif);
  }
  .pinfo{ min-width:0; flex:1; }
  .pname{ font-size:12.8px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .popt{ font-size:11px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pqty{ font-size:11.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .empty-fixture{ font-size:12px; color:var(--ink-dim); padding:8px 0; }

  .results-list{ display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--line); }
  .rrow{ display:grid; grid-template-columns:38px 1fr 120px 90px 70px; gap:10px; align-items:center; background:var(--card); padding:9px 14px; }
  .rrow .rthumb{ width:28px; height:28px; border-radius:6px; overflow:hidden; background:var(--paper-2); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; font-size:12px; color:var(--ink-dim); font-family:var(--serif); }
  .rrow .rname{ min-width:0; }
  .rrow .rname .n1{ font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .rname .n2{ font-size:11px; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .rstore{ font-size:11.5px; color:var(--ink-dim); }
  .rrow .rloc{ font-size:11.5px; font-variant-numeric:tabular-nums; }
  .rrow .rqty{ font-size:11.5px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-dim); }
  .results-head{ display:grid; grid-template-columns:38px 1fr 120px 90px 70px; gap:10px; padding:0 14px 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); }

  .state-msg{ padding:60px 20px; text-align:center; color:var(--ink-dim); font-size:13px; }
  .state-msg .big{ font-size:15px; color:var(--ink); margin-bottom:6px; }

  @media (max-width: 760px){
    .sidebar{ display:none; }
    .rrow, .results-head{ grid-template-columns:30px 1fr 70px; }
    .rrow .rstore, .rrow .rqty, .results-head :nth-child(4), .results-head :nth-child(5){ display:none; }
  }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">VERISH DP</div>
      <div class="sub">매장별 조닝 대시보드</div>
    </div>
    <div>
      <div class="store-group-label">매장 선택</div>
      <nav class="storelist" id="storelist"></nav>
    </div>
    <div class="sidebar-foot">
      <div><span class="snap-dot"></span>스냅샷 데이터</div>
      <div style="margin-top:6px;">이 페이지는 실시간 연동이 아니라, 특정 시점에 구글 시트 내용을 담아둔 스냅샷입니다. 최신 데이터가 필요하면 담당자에게 갱신을 요청해주세요.</div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="storeTitle">매장을 선택하세요</h1>
        <div class="meta" id="storeMeta">왼쪽에서 매장을 클릭하면 조닝 데이터를 볼 수 있습니다.</div>
      </div>
      <div class="snap-badge">데이터 기준 · __SNAPSHOT_TIME__</div>
    </header>

    <div class="searchwrap">
      <div class="searchbox">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="text" placeholder="상품명·옵션·컬러·SKU로 검색 (예: 쿨핏 브라, S21669)" autocomplete="off" />
      </div>
      <div class="scope-toggle" role="group" aria-label="검색 범위">
        <button id="scopeStore" class="active">이 매장</button>
        <button id="scopeAll">전체 매장</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="state-msg"><div class="big">매장을 선택해 조닝별 상품 배치를 확인하세요</div>왼쪽 목록에서 매장을 고르면 해당 매장의 조닝 데이터가 표시됩니다.</div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  var SNAPSHOT_TIME = "__SNAPSHOT_TIME__";
  var SNAPSHOT = __SNAPSHOT_JSON__;

  var STORES = [
    { key:"dosan",  name:"베리시 도산",       tier:"컨시어지 · S" },
    { key:"seongsu",name:"베리시 성수",       tier:"플래그십 · L2" },
    { key:"anguk",  name:"베리시 안국",       tier:"세일즈 · M" },
    { key:"myeongdong", name:"베리시 명동",   tier:"세일즈 · L1" },
    { key:"dongbusan", name:"베리시 롯데 동부산", tier:"아울렛" },
    { key:"daejeon",name:"신세계 대전",       tier:"백화점" },
    { key:"hanam",  name:"스타필드 하남",     tier:"백화점" },
    { key:"jeju",   name:"신제주",            tier:"세일즈 · L1" },
    { key:"aewol",  name:"애월",              tier:"세일즈 · M" }
  ];

  // ---------- state ----------
  var state = {
    activeStore: null,
    activeZone: null,
    activeFixture: null,
    scope: "store",  // 'store' | 'all'
    query: ""
  };

  var els = {
    storelist: document.getElementById("storelist"),
    storeTitle: document.getElementById("storeTitle"),
    storeMeta: document.getElementById("storeMeta"),
    content: document.getElementById("content"),
    searchInput: document.getElementById("searchInput"),
    scopeStore: document.getElementById("scopeStore"),
    scopeAll: document.getElementById("scopeAll")
  };

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function qtyLabel(p){ return (p.dpQty === "" || p.dpQty == null) ? "—" : esc(p.dpQty)+"개"; }

  function renderStoreList(){
    els.storelist.innerHTML = STORES.map(function(s){
      return '<button class="store-btn" data-key="'+s.key+'" aria-pressed="false">' +
        '<span>'+esc(s.name)+'</span><span class="tier">'+esc(s.tier)+'</span></button>';
    }).join("");
    Array.prototype.forEach.call(els.storelist.querySelectorAll(".store-btn"), function(btn){
      btn.addEventListener("click", function(){ selectStore(btn.getAttribute("data-key")); });
    });
  }

  function setActiveBtn(key){
    Array.prototype.forEach.call(els.storelist.querySelectorAll(".store-btn"), function(btn){
      var on = btn.getAttribute("data-key") === key;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function storeByKey(key){ for (var i=0;i<STORES.length;i++){ if (STORES[i].key===key) return STORES[i]; } return null; }

  function selectStore(key){
    state.activeStore = key;
    state.activeZone = null;
    state.activeFixture = null;
    setActiveBtn(key);
    var store = storeByKey(key);
    els.storeTitle.textContent = store.name;
    els.storeMeta.textContent = store.tier + " 매장 · 조닝별 상품 배치";
    renderBody();
  }

  // ---------- zoning view ----------
  function renderZoning(){
    var entry = SNAPSHOT[state.activeStore];
    if (!entry) return;
    var zoneCap = entry.zoneCap, dpRaw = entry.dpRaw;

    var zonesOrder = [], seen = {};
    zoneCap.forEach(function(r){ var z = r.zone || "미분류"; if (!seen[z]){ seen[z]=1; zonesOrder.push(z); } });
    if (!state.activeZone || (state.activeZone !== "__ALL__" && zonesOrder.indexOf(state.activeZone) === -1)) state.activeZone = zonesOrder[0] || null;

    var pills = '<div class="zone-pills">' +
      '<button class="pill'+(state.activeZone === "__ALL__" && !state.activeFixture?' active':'')+'" data-zone="__ALL__">전체 <span style="opacity:.6">· '+zoneCap.length+'</span></button>' +
      zonesOrder.map(function(z){
      var count = zoneCap.filter(function(r){ return (r.zone||"미분류")===z; }).length;
      return '<button class="pill'+(z===state.activeZone && !state.activeFixture?' active':'')+'" data-zone="'+esc(z)+'">'+esc(z)+' <span style="opacity:.6">· '+count+'</span></button>';
    }).join("") +
      '<select class="loc-select" id="locSelect" aria-label="위치로 바로가기">' +
        '<option value="">위치로 바로가기…</option>' +
        zonesOrder.map(function(z){
          var opts = zoneCap.filter(function(r){ return (r.zone||"미분류")===z; }).map(function(f){
            var val = z + "||" + f.fixture;
            return '<option value="'+esc(val)+'"'+(state.activeFixture===f.fixture && state.activeZone===z?' selected':'')+'>'+esc(f.fixture)+'</option>';
          }).join("");
          return '<optgroup label="'+esc(z)+'">'+opts+'</optgroup>';
        }).join("") +
      '</select>' +
      (state.activeFixture ? '<button class="pill" id="clearFixture">✕ '+esc(state.activeFixture)+' 필터 해제</button>' : "") +
    '</div>';

    var showingAll = state.activeZone === "__ALL__";
    var fixturesInZone = showingAll ? zoneCap : zoneCap.filter(function(r){ return (r.zone||"미분류") === state.activeZone; });
    var fixtures = state.activeFixture ? fixturesInZone.filter(function(f){ return f.fixture === state.activeFixture; }) : fixturesInZone;
    var grid = '<div class="fixture-grid">' + fixtures.map(function(f){
      var placed = dpRaw.filter(function(p){ return p.location === f.fixture; });
      var pct = f.maxCapa > 0 ? Math.min(100, Math.round((f.current / f.maxCapa) * 100)) : 0;
      var barClass = f.current > f.maxCapa ? "over" : (pct >= 90 ? "warn" : "");
      var rows = placed.length ? placed.map(function(p){
        return '<div class="prow">' +
          '<div class="thumb">'+esc((p.product||"?").slice(0,1))+'</div>' +
          '<div class="pinfo"><div class="pname">'+esc(p.product)+'</div><div class="popt">'+esc(p.color)+' · '+esc(p.size)+'</div></div>' +
          '<div class="pqty">'+qtyLabel(p)+'</div>' +
        '</div>';
      }).join("") : '<div class="empty-fixture">배치된 상품 없음</div>';
      return '<div class="fixture-card">' +
        '<div class="fhead"><div class="fname">'+esc(f.fixture)+(showingAll ? ' <span class="fzone">'+esc(f.zone||"미분류")+'</span>' : '')+'</div><div class="fcount">'+f.current+' / '+f.maxCapa+'</div></div>' +
        '<div class="capbar"><div class="'+barClass+'" style="width:'+pct+'%"></div></div>' +
        '<div class="plist">'+rows+'</div>' +
      '</div>';
    }).join("") + '</div>';

    if (!fixtures.length){
      grid = '<div class="state-msg">'+(state.activeFixture ? '"'+esc(state.activeFixture)+'" 위치를 이 조닝에서 찾을 수 없습니다.' : '이 조닝에는 등록된 집기가 없습니다.')+'</div>';
    }

    els.content.innerHTML = pills + grid;
    Array.prototype.forEach.call(els.content.querySelectorAll(".pill[data-zone]"), function(p){
      p.addEventListener("click", function(){
        state.activeZone = p.getAttribute("data-zone");
        state.activeFixture = null;
        renderZoning();
      });
    });
    var clearBtn = document.getElementById("clearFixture");
    if (clearBtn) clearBtn.addEventListener("click", function(){ state.activeFixture = null; renderZoning(); });
    var locSelect = document.getElementById("locSelect");
    if (locSelect) locSelect.addEventListener("change", function(){
      var val = locSelect.value;
      if (!val){ state.activeFixture = null; renderZoning(); return; }
      var parts = val.split("||");
      state.activeZone = parts[0];
      state.activeFixture = parts[1];
      renderZoning();
    });
  }

  // ---------- search view ----------
  function matchRow(p, q){
    if (!q) return true;
    q = q.toLowerCase();
    return [p.product,p.option,p.color,p.size,p.sku].join(" ").toLowerCase().indexOf(q) !== -1;
  }
  function renderSearch(){
    var q = state.query.trim();
    var results = [];

    if (state.scope === "store"){
      var entry = SNAPSHOT[state.activeStore];
      if (!entry){ els.content.innerHTML = '<div class="state-msg">먼저 왼쪽에서 매장을 선택하세요.</div>'; return; }
      entry.dpRaw.filter(function(p){ return matchRow(p, q); }).forEach(function(p){
        results.push({ p:p, storeName: storeByKey(state.activeStore).name });
      });
    } else {
      STORES.forEach(function(s){
        (SNAPSHOT[s.key].dpRaw || []).filter(function(p){ return matchRow(p, q); }).forEach(function(p){
          results.push({ p:p, storeName:s.name });
        });
      });
    }

    if (!q){
      els.content.innerHTML = '<div class="state-msg"><div class="big">검색어를 입력하세요</div>상품명, 옵션, 컬러, SKU로 찾을 수 있습니다.</div>';
      return;
    }
    if (!results.length){
      els.content.innerHTML = '<div class="state-msg"><div class="big">일치하는 상품이 없습니다</div>"'+esc(q)+'" 에 대한 진열 상품을 찾을 수 없습니다.</div>';
      return;
    }

    var head = '<div class="results-head"><div></div><div>상품</div><div>매장</div><div>위치</div><div style="text-align:right">DP수량</div></div>';
    var rows = results.slice(0, 400).map(function(x){
      var p = x.p;
      return '<div class="rrow">' +
        '<div class="rthumb">'+esc((p.product||"?").slice(0,1))+'</div>' +
        '<div class="rname"><div class="n1">'+esc(p.product)+'</div><div class="n2">'+esc(p.color)+' · '+esc(p.size)+' · '+esc(p.sku)+'</div></div>' +
        '<div class="rstore">'+esc(x.storeName)+'</div>' +
        '<div class="rloc">'+esc(p.zone)+' · '+esc(p.location)+'</div>' +
        '<div class="rqty">'+qtyLabel(p)+'</div>' +
      '</div>';
    }).join("");
    var note = results.length > 400 ? '<div class="state-msg" style="padding:14px 0 0;">총 '+results.length+'건 중 400건 표시 — 검색어를 더 구체적으로 입력해보세요.</div>' : "";

    els.content.innerHTML = '<div class="results-list">' + head + rows + '</div>' + note;
  }

  function renderBody(){
    if (state.query.trim() || state.scope === "all") renderSearch();
    else if (state.activeStore) renderZoning();
  }

  els.searchInput.addEventListener("input", function(){
    state.query = els.searchInput.value;
    renderBody();
  });
  els.scopeStore.addEventListener("click", function(){
    state.scope = "store"; els.scopeStore.classList.add("active"); els.scopeAll.classList.remove("active");
    renderBody();
  });
  els.scopeAll.addEventListener("click", function(){
    state.scope = "all"; els.scopeAll.classList.add("active"); els.scopeStore.classList.remove("active");
    renderBody();
  });

  // ---------- boot ----------
  renderStoreList();
  selectStore(STORES[0].key);
})();
</script>
